<!DOCTYPE html>

<head>
<meta charset="UTF-8">
<title>কমিক্স সংগ্রহ</title>

<style>
:root{
--primary:#4f46e5;--secondary:#7c3aed;--bg:#eef2ff;--card:#ffffff;
--text:#1f2937;--muted:#6b7280;--border:#e5e7eb;
}
*{box-sizing:border-box}
body{
margin:0;
font-family:Inter,"Noto Sans Bengali","Hind Siliguri",Arial,sans-serif;
background:linear-gradient(135deg,#eef2ff,#f8fafc 60%,#ffffff);
color:var(--text);
margin:20px;
font-size:1.2em;
}
h1{
max-width:1200px;
margin:30px auto 20px;
padding:0 20px;
font-size:2.2rem;
font-weight:700;
text-align:center;
}
.accordion{
max-width:1200px;
margin:20px auto 50px;
padding:0 20px;
}
#searchBox{
display:block!important;
width:100%!important;
max-width:1200px!important;
margin:0 auto 24px!important;
padding:16px 20px!important;
font-size:17px!important;
border:1px solid var(--border);
border-radius:16px;
outline:none;
background:#fff;
box-shadow:0 8px 24px rgba(0,0,0,.08);
transition:.25s;
}
#searchBox:focus{
border-color:var(--primary);
box-shadow:0 0 0 4px rgba(79,70,229,.15);
}
.publisher,.type{
display:flex;
justify-content:space-between;
align-items:center;
padding:16px 20px;
border-radius:14px;
margin-top:14px;
cursor:pointer;
transition:.25s;
user-select:none;
box-shadow:0 8px 18px rgba(0,0,0,.08);
}
.publisher{
background:linear-gradient(135deg,var(--primary),var(--secondary));
color:#fff;
font-size:1.6em;
font-weight:700;
}
.publisher:hover,.type:hover{
transform:translateY(-2px);
}
.type{
background:#d5d8ff;
color:#27292d;
border:1px solid var(--border);
font-weight:600;
font-size:1.4em;
}
.content{
display:none;
background:#fff;
border-radius:0 0 16px 16px;
padding:18px;
margin-bottom:16px;
box-shadow:0 10px 24px rgba(0,0,0,.08);
overflow:auto;
}
table{
width:100%;
border-collapse:collapse;
overflow:hidden;
border-radius:12px;
}
th{
background:#eef2ff;
position:sticky;
top:0;
}
th,td{
padding:12px 14px;
border-bottom:1px solid var(--border);
}
tr:nth-child(even){background:#fafafa}
tr:hover{background:#eef4ff}
.empty{color:var(--muted);font-style:italic}
@media(max-width:768px){
h1{font-size:1.6rem}
th,td{font-size:.92rem;padding:10px}
}
</style>
</head>

<body>

function groupData(data){

const grouped = {};

data.forEach(item => {

if(!grouped[item.publisher]){
grouped[item.publisher] = {
types:{},
directRows:[],
nameSet:new Set()
};
}

grouped[item.publisher].nameSet.add(item.name.trim());

if(!item.type || item.type.trim()===""){
grouped[item.publisher].directRows.push(item);
return;
}

if(!grouped[item.publisher].types[item.type]){
grouped[item.publisher].types[item.type]={
rows:[],
nameSet:new Set()
};
}

grouped[item.publisher].types[item.type].rows.push(item);
grouped[item.publisher].types[item.type].nameSet.add(item.name.trim());

});

return grouped;

}



const accordion = document.getElementById("accordion");
const searchBox = document.getElementById("searchBox");



function render(filteredData){

accordion.innerHTML="";

const grouped = groupData(filteredData);

Object.keys(grouped).forEach(publisher => {

const publisherCount = grouped[publisher].nameSet.size;

const publisherHeader = document.createElement("div");
publisherHeader.className="publisher";
publisherHeader.textContent = publisher + " (" + publisherCount + ")";

const publisherContent = document.createElement("div");
publisherContent.className="content";


/* rows with no type */

if(grouped[publisher].directRows.length>0){

let table = `
<table>
<thead>
<tr>
<th>Name</th>
<th>Grade</th>
</tr>
</thead>
<tbody>
`;

grouped[publisher].directRows.forEach(row => {

table += `
<tr>
<td>${row.name}</td>
<td>${row.format ? row.format : '<span class="empty">—</span>'}</td>
</tr>
`;

});

table += "</tbody></table>";

const directContent = document.createElement("div");
directContent.innerHTML = table;

publisherContent.appendChild(directContent);

}



/* types */

Object.keys(grouped[publisher].types).forEach(type => {

const typeHeader = document.createElement("div");
typeHeader.className="type";

const distinctCount = grouped[publisher].types[type].nameSet.size;

typeHeader.textContent = type + " (" + distinctCount + ")";

const typeContent = document.createElement("div");
typeContent.className="content";

let table = `
<table>
<thead>
<tr>
<th>Name</th>
<th>Grade</th>
</tr>
</thead>
<tbody>
`;

grouped[publisher].types[type].rows.forEach(row => {

table += `
<tr>
<td>${row.name}</td>
<td>${row.format ? row.format : '<span class="empty">—</span>'}</td>
</tr>
`;

});

table += "</tbody></table>";

typeContent.innerHTML = table;

typeHeader.onclick = function(){
typeContent.style.display =
typeContent.style.display==="block" ? "none":"block";
};

publisherContent.appendChild(typeHeader);
publisherContent.appendChild(typeContent);

});


publisherHeader.onclick = function(){
publisherContent.style.display =
publisherContent.style.display==="block" ? "none":"block";
};

accordion.appendChild(publisherHeader);
accordion.appendChild(publisherContent);

});

}



render(data);



searchBox.addEventListener("input",function(){

const query = this.value.trim().toLowerCase();

if(!query){
render(data);
return;
}

const filtered = data.filter(item =>
item.name.toLowerCase().includes(query)
);

render(filtered);

});
